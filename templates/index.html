<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Search - 论文检索系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- DOI Update Progress Bar (fixed at top) -->
    <div class="doi-progress-bar" id="doiProgressBar">
        <div class="doi-progress-track">
            <div class="doi-progress-fill" id="doiProgressFill"></div>
        </div>
        <span class="doi-progress-text" id="doiProgressText">正在更新论文信息...</span>
        <button class="doi-progress-cancel" onclick="cancelDoiUpdate()" title="取消">✕</button>
    </div>

    <!-- Floating Search Bar (shows when scrolled) -->
    <div class="floating-search-bar" id="floatingSearchBar">
        <div class="floating-search-content">
            <div class="floating-search-box">
                <input type="text" id="searchInputFloating" class="floating-search-input" placeholder="搜索论文 (支持期刊缩写如AER, QJE, JPE等)" autocomplete="off">
                <button class="floating-search-btn" onclick="triggerSearchFromFloating()">🔍</button>
            </div>
            <div class="floating-stats">
                <span id="floatingStatPapers">0</span> 篇 · <span id="floatingStatTags">0</span> 标签
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- Scrollable Left Section -->
        <div class="left-section" id="leftSection">
            <!-- Header -->
            <header class="header" id="mainHeader">
                <div class="header-content">
                    <div class="logo">
                        <span class="logo-icon">📚</span>
                        <div>
                            <div class="logo-text">Paper Search</div>
                            <div class="logo-subtitle">论文检索系统</div>
                        </div>
                    </div>
                    <nav class="header-nav">
                        <a href="/" class="nav-link active">本地文献</a>
                        <a href="/online" class="nav-link">在线搜索</a>
                        <button class="nav-link" onclick="openSettings()">⚙️ 设置</button>
                    </nav>
                </div>
            </header>

            <!-- Search Section -->
            <section class="search-section" id="searchSection">
                <div class="search-container">
                    <div class="search-box">
                        <input type="text" id="searchInput" class="search-input" placeholder="搜索标题、作者、期刊(支持缩写AER/QJE/JPE等)..." autocomplete="off">
                        <span class="search-icon">🔍</span>
                        <button class="search-btn" onclick="triggerSearch()">搜索</button>
                        <button class="search-clear" onclick="clearSearch()">✕</button>
                        <div class="suggestions-dropdown" id="suggestionsDropdown"></div>
                    </div>
                    <div class="search-tips">提示：使用 + 表示或，* 表示且。例如：Bursztyn * AER</div>
                    <div class="stats-bar">
                        <span class="stat-item">📄 <span class="stat-value" id="statPapers">0</span> 篇</span>
                        <span class="stat-item">🏷️ <span class="stat-value" id="statTags">0</span> 标签</span>
                        <span class="stat-item">👤 <span class="stat-value" id="statAuthors">0</span> 作者</span>
                    </div>
                </div>
            </section>

            <!-- Quick Add Zone (collapsible with animation) -->
            <div class="quick-add-wrapper" id="quickAddWrapper">
                <div class="quick-add-zone" id="quickAddZone">
                    <div class="drop-zone" id="dropZone">
                        <div class="drop-zone-content">
                            <span class="drop-icon">📥</span>
                            <span class="drop-text" id="dropText">输入文件路径或拖拽到此处</span>
                            <span class="drop-hint">添加后自动获取DOI信息 (文件保持原位置)</span>
                        </div>
                        <div class="quick-add-input-row">
                            <input type="text" id="quickAddPath" class="quick-add-input" placeholder="文件路径，如 E:\研究\论文\xxx.pdf">
                            <button class="btn btn-primary btn-sm" onclick="addFileByPath()">添加</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <div class="results-header">
                    <span class="results-title">搜索结果 (<span id="resultsCount">0</span>)</span>
                    <div class="results-actions">
                        <button class="btn btn-secondary btn-sm" id="quickAddBtn" onclick="toggleQuickAdd()">➕ 快速添加</button>
                        <button class="btn btn-secondary btn-sm" onclick="showScanOptions()">🔄 扫描</button>
                    </div>
                </div>
                <div class="papers-grid" id="papersGrid">
                    <div class="empty-state">
                        <div class="empty-state-icon">📂</div>
                        <div class="empty-state-title">开始探索您的论文库</div>
                        <div class="empty-state-text">在上方搜索框中输入论文标题、作者名或关键词进行搜索。</div>
                        <button class="btn btn-primary" onclick="showScanOptions()">扫描论文文件夹</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Fixed Right Preview Panel -->
        <div class="preview-panel" id="previewPanel">
            <div class="preview-header">
                <span class="preview-title">论文预览</span>
                <div class="preview-actions">
                    <button class="btn btn-secondary btn-sm" onclick="openCurrentPaper()" id="btnOpenPaper" disabled>📂 打开</button>
                    <button class="btn btn-secondary btn-sm" onclick="editCurrentPaper()" id="btnEditPaper" disabled>✏️ 编辑</button>
                </div>
            </div>
            <div class="preview-content" id="previewContent">
                <div class="preview-placeholder" id="previewPlaceholder">
                    <div class="preview-placeholder-icon">📄</div>
                    <p>选择一篇论文查看预览</p>
                </div>
                <div class="preview-info" id="previewInfo" style="display: none;"></div>
                <div class="preview-pdf" id="previewPdf" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Scan Options Modal -->
    <div class="modal-overlay" id="scanOptionsModal">
        <div class="modal modal-sm">
            <div class="modal-header">
                <h2 class="modal-title">扫描选项</h2>
                <button class="modal-close" onclick="closeScanOptions()">×</button>
            </div>
            <div class="modal-body">
                <div class="scan-options">
                    <button class="scan-option-btn" onclick="scanPapers(true)">
                        <span class="scan-option-icon">📥</span>
                        <div class="scan-option-text">
                            <strong>扫描更新</strong>
                            <span>只添加新文件，保留已有DOI数据</span>
                        </div>
                    </button>
                    <button class="scan-option-btn" onclick="scanPapers(false)">
                        <span class="scan-option-icon">🔄</span>
                        <div class="scan-option-text">
                            <strong>重新扫描</strong>
                            <span>重新扫描所有文件（保留DOI数据）</span>
                        </div>
                    </button>
                </div>
                <div class="doi-update-options" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border-color);">
                    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px;">DOI信息更新:</p>
                    <button class="scan-option-btn small" onclick="startDoiUpdate(false)">
                        <span class="scan-option-icon">🔍</span>
                        <div class="scan-option-text">
                            <strong>更新缺失</strong>
                            <span>只更新缺少信息的论文</span>
                        </div>
                    </button>
                    <button class="scan-option-btn small" onclick="startDoiUpdate(true)">
                        <span class="scan-option-icon">🔄</span>
                        <div class="scan-option-text">
                            <strong>全部更新</strong>
                            <span>重新获取所有论文的DOI信息</span>
                        </div>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Edit Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal modal-lg">
            <div class="modal-header">
                <h2 class="modal-title">编辑论文信息</h2>
                <button class="modal-close" onclick="closeEditModal()">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editPaperId">
                <div class="form-group">
                    <label class="form-label">标题</label>
                    <input type="text" class="form-input" id="editTitle">
                </div>
                <div class="form-row">
                    <div class="form-group flex-1">
                        <label class="form-label">作者</label>
                        <div class="tag-input-container">
                            <div class="tag-chips" id="authorChips"></div>
                            <input type="text" class="tag-input" id="editAuthorsInput" placeholder="输入作者名后按 Enter">
                        </div>
                        <input type="hidden" id="editAuthors">
                    </div>
                    <div class="form-group" style="width: 100px;">
                        <label class="form-label">年份</label>
                        <input type="text" class="form-input" id="editYear" placeholder="2024">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">期刊</label>
                    <input type="text" class="form-input" id="editJournal" placeholder="期刊名称">
                </div>
                <div class="form-group">
                    <label class="form-label">标签</label>
                    <div class="tag-input-container">
                        <div class="tag-chips" id="tagChips"></div>
                        <input type="text" class="tag-input" id="editTagsInput" placeholder="输入标签后按 Enter">
                    </div>
                    <input type="hidden" id="editTags">
                </div>
                <div class="form-group">
                    <label class="form-label">摘要</label>
                    <textarea class="form-textarea" id="editAbstract" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditModal()">取消</button>
                <button class="btn btn-primary" onclick="savePaper()">保存</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">设置</h2>
                <button class="modal-close" onclick="closeSettings()">×</button>
            </div>
            <div class="modal-body">
                <div class="settings-section">
                    <h3 class="settings-title">论文文件夹</h3>
                    <input type="text" class="form-input" id="settingsPapersDir" placeholder="E:\研究">
                </div>
                <div class="settings-section">
                    <h3 class="settings-title">预览设置</h3>
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" id="settingsAutoPreview" checked>
                        自动加载PDF预览
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeSettings()">取消</button>
                <button class="btn btn-primary" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <!-- Scan Progress Modal -->
    <div class="modal-overlay" id="scanModal">
        <div class="modal modal-sm">
            <div class="modal-header"><h2 class="modal-title">扫描论文</h2></div>
            <div class="modal-body" style="text-align: center; padding: 2rem;">
                <div class="scan-progress">
                    <div class="scan-icon">📂</div>
                    <div class="progress-bar-container">
                        <div class="progress-bar" id="scanProgressBar" style="width: 0%"></div>
                    </div>
                    <div class="scan-status" id="scanStatus">正在准备...</div>
                    <div class="scan-detail" id="scanDetail"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Footer -->
    <footer class="app-footer">
        <span class="footer-version" id="footerVersion">v1.0.0</span>
        <a href="https://github.com/yuyangzhan-econ/Paper-search-system-" target="_blank" class="footer-link">YuyangZhan-econ</a>
    </footer>

    <style>
        /* Layout */
        html, body { height: 100%; margin: 0; overflow: hidden; }
        .app-container {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .left-section {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 60px;
        }
        .preview-panel {
            width: 420px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            height: 100vh;
            overflow: hidden;
        }
        .preview-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .preview-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        /* DOI Progress Bar (fixed) */
        .doi-progress-bar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 32px;
            background: #2c5282;
            z-index: 2000;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
        }
        .doi-progress-bar.active { display: flex; }
        .doi-progress-track { width: 180px; height: 6px; background: rgba(255,255,255,0.3); border-radius: 3px; }
        .doi-progress-fill { height: 100%; width: 0%; background: #48bb78; border-radius: 3px; transition: width 0.3s; }
        .doi-progress-text { flex: 1; color: white; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .doi-progress-cancel { background: rgba(255,255,255,0.2); border: none; color: white; cursor: pointer; padding: 4px 10px; border-radius: 4px; }
        body.doi-updating .left-section { padding-top: 32px; }
        body.doi-updating .preview-panel { padding-top: 32px; }
        body.doi-updating .floating-search-bar { top: 32px; }

        /* Floating Search Bar */
        .floating-search-bar {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 420px;
            z-index: 150;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding: 8px 20px;
        }
        .floating-search-bar.visible { display: block; }
        .floating-search-content { display: flex; align-items: center; gap: 16px; }
        .floating-search-box { flex: 1; max-width: 500px; display: flex; background: white; border: 1px solid #d0d5dd; border-radius: 20px; overflow: hidden; }
        .floating-search-input { flex: 1; border: none; padding: 8px 14px; font-size: 13px; outline: none; }
        .floating-search-btn { background: transparent; border: none; padding: 8px 12px; cursor: pointer; }
        .floating-stats { font-size: 12px; color: #4a5568; }

        /* Quick Add with animation */
        .quick-add-wrapper {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        .quick-add-wrapper.active { max-height: 200px; }
        .quick-add-zone { padding: 0 20px 16px; }
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            background: var(--bg-secondary);
            transition: all 0.2s;
        }
        .drop-zone.drag-over { border-color: var(--primary); background: rgba(44,82,130,0.05); }
        .drop-zone-content { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .drop-icon { font-size: 1.5rem; }
        .drop-text { font-size: 0.9rem; color: var(--text-primary); }
        .drop-hint { font-size: 0.8rem; color: var(--text-muted); }
        .quick-add-input-row { display: flex; gap: 8px; margin-top: 12px; }
        .quick-add-input { flex: 1; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 13px; }

        /* Results */
        .results-section { padding: 0 20px; }
        .results-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 8px; }
        .papers-grid { }

        /* Compact Paper Card */
        .paper-card {
            padding: 10px 12px;
            margin-bottom: 6px;
            border-radius: 6px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.15s;
        }
        .paper-card:hover { border-color: var(--primary); }
        .paper-card.active { border-color: var(--primary); background: rgba(44,82,130,0.03); }
        .paper-card.updating { animation: glowPulse 1.5s infinite; }
        @keyframes glowPulse { 0%,100%{box-shadow:0 0 0 0 rgba(72,187,120,0.5)} 50%{box-shadow:0 0 0 4px rgba(72,187,120,0.15)} }

        .paper-title { font-size: 0.9rem; font-weight: 600; color: var(--text-primary); line-height: 1.3; margin-bottom: 3px; }
        .paper-authors { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 2px; }
        .paper-journal { font-size: 0.8rem; color: var(--primary); font-style: italic; margin-bottom: 2px; }
        .paper-year-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 2px; }
        .paper-year { font-size: 0.75rem; color: var(--text-muted); }
        .paper-tag { font-size: 0.65rem; padding: 1px 6px; background: var(--bg-tertiary); border-radius: 8px; color: var(--text-muted); }
        .paper-folder { font-size: 0.7rem; color: var(--text-light); }

        /* Scan Options */
        .scan-options { display: flex; flex-direction: column; gap: 10px; }
        .scan-option-btn {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px;
            border: 1px solid var(--border-color); border-radius: 8px;
            background: var(--bg-secondary); cursor: pointer; text-align: left;
            transition: all 0.2s;
        }
        .scan-option-btn:hover { border-color: var(--primary); }
        .scan-option-btn.small { padding: 10px 14px; }
        .scan-option-icon { font-size: 1.5rem; }
        .scan-option-btn.small .scan-option-icon { font-size: 1.2rem; }
        .scan-option-text { display: flex; flex-direction: column; gap: 2px; }
        .scan-option-text strong { font-size: 0.95rem; }
        .scan-option-text span { font-size: 0.8rem; color: var(--text-muted); }

        /* Search Section */
        .search-section { padding: 16px 20px; }
        .search-tips { text-align: center; margin-top: 6px; font-size: 0.75rem; color: var(--text-muted); }

        /* Footer */
        .app-footer {
            position: fixed; bottom: 8px; right: 8px; z-index: 100;
            display: flex; gap: 8px; align-items: center;
            padding: 6px 12px; background: rgba(255,255,255,0.9);
            border-radius: 16px; font-size: 11px; color: var(--text-muted);
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .footer-version { color: var(--primary); font-weight: 600; }
        .footer-link { color: var(--text-secondary); text-decoration: none; }
    </style>

    <script src="/static/js/app.js"></script>
    <script>
        let doiUpdateQueue = [];
        let isProcessingQueue = false;

        document.addEventListener('DOMContentLoaded', function() {
            fetch('/api/version').then(r=>r.json()).then(d=>{document.getElementById('footerVersion').textContent='v'+d.version}).catch(()=>{});
            setupDropZone();
            setupScrollDetection();
            document.getElementById('searchInputFloating').addEventListener('keypress', e=>{if(e.key==='Enter'){document.getElementById('searchInput').value=e.target.value;triggerSearch();scrollToTop();}});
            document.getElementById('quickAddPath').addEventListener('keypress', e=>{if(e.key==='Enter')addFileByPath();});
            checkDoiProgress();
        });

        function setupScrollDetection() {
            const leftSection = document.getElementById('leftSection');
            const searchSection = document.getElementById('searchSection');
            const floatingBar = document.getElementById('floatingSearchBar');
            leftSection.addEventListener('scroll', function() {
                const rect = searchSection.getBoundingClientRect();
                floatingBar.classList.toggle('visible', rect.bottom < 0);
            });
        }

        function scrollToTop() {
            document.getElementById('leftSection').scrollTo({top:0,behavior:'smooth'});
        }

        function toggleQuickAdd() {
            const wrapper = document.getElementById('quickAddWrapper');
            const btn = document.getElementById('quickAddBtn');
            wrapper.classList.toggle('active');
            btn.textContent = wrapper.classList.contains('active') ? '📥 收起' : '➕ 快速添加';
        }

        function setupDropZone() {
            const dropZone = document.getElementById('dropZone');
            ['dragenter','dragover','dragleave','drop'].forEach(e=>dropZone.addEventListener(e,preventDefaults,false));
            ['dragenter','dragover'].forEach(e=>dropZone.addEventListener(e,()=>dropZone.classList.add('drag-over'),false));
            ['dragleave','drop'].forEach(e=>dropZone.addEventListener(e,()=>dropZone.classList.remove('drag-over'),false));
            dropZone.addEventListener('drop', handleDrop, false);
        }

        function preventDefaults(e){e.preventDefault();e.stopPropagation();}

        function handleDrop(e) {
            const items = e.dataTransfer.items;
            if (items && items.length > 0) {
                // Try to get file path (works in some environments)
                for (let i = 0; i < items.length; i++) {
                    const item = items[i];
                    if (item.kind === 'file') {
                        const file = item.getAsFile();
                        if (file.path) {
                            addFileByPathValue(file.path);
                        } else {
                            showToast('请在输入框中粘贴文件路径', 'info');
                        }
                        break;
                    }
                }
            }
        }

        function addFileByPath() {
            const path = document.getElementById('quickAddPath').value.trim();
            if (!path) { showToast('请输入文件路径', 'error'); return; }
            addFileByPathValue(path);
        }

        function addFileByPathValue(path) {
            fetch('/api/papers/add-file', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({file_path: path})
            })
            .then(r=>r.json())
            .then(data => {
                if (data.success) {
                    showToast('已添加: ' + (data.paper.title || data.paper.file_name), 'success');
                    document.getElementById('quickAddPath').value = '';
                    loadStats();
                    if (document.getElementById('searchInput').value) triggerSearch();
                    // Auto-update DOI
                    if (data.paper.doi) {
                        queueDoiUpdate(data.paper.id);
                    }
                } else {
                    showToast(data.error || '添加失败', 'error');
                }
            })
            .catch(()=>showToast('添加失败', 'error'));
        }

        function queueDoiUpdate(paperId) {
            fetch('/api/doi/progress').then(r=>r.json()).then(data => {
                if (data.running) {
                    // Add to running batch
                    fetch('/api/doi/add-to-queue', {
                        method: 'POST',
                        headers: {'Content-Type':'application/json'},
                        body: JSON.stringify({paper_id: paperId})
                    }).then(r=>r.json()).then(d => {
                        if (d.success) showToast('已加入DOI更新队列', 'info');
                    });
                } else {
                    // Update immediately
                    fetch(`/api/papers/${paperId}/fetch-doi`, {method:'POST'})
                    .then(r=>r.json())
                    .then(d => {
                        if (d.success) {
                            showToast('DOI信息已更新', 'success');
                            if (document.getElementById('searchInput').value) triggerSearch();
                        }
                    });
                }
            });
        }

        function triggerSearchFromFloating() {
            document.getElementById('searchInput').value = document.getElementById('searchInputFloating').value;
            triggerSearch();
            scrollToTop();
        }

        // Override triggerSearch to scroll to top
        const _originalTriggerSearch = window.triggerSearch;
        if (_originalTriggerSearch) {
            window.triggerSearch = function() {
                _originalTriggerSearch();
                scrollToTop();
            };
        }

        function showScanOptions() {
            document.getElementById('scanOptionsModal').classList.add('active');
        }

        function closeScanOptions() {
            document.getElementById('scanOptionsModal').classList.remove('active');
        }

        function scanPapers(incremental) {
            closeScanOptions();
            const scanModal = document.getElementById('scanModal');
            scanModal.classList.add('active');

            fetch('/api/scan', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({incremental: incremental})
            })
            .then(r=>r.json())
            .then(data => {
                if (data.success) pollScanProgress();
                else { showToast(data.error || '扫描启动失败', 'error'); scanModal.classList.remove('active'); }
            })
            .catch(()=>{ showToast('扫描启动失败', 'error'); scanModal.classList.remove('active'); });
        }

        function pollScanProgress() {
            const bar = document.getElementById('scanProgressBar');
            const status = document.getElementById('scanStatus');
            const detail = document.getElementById('scanDetail');

            function poll() {
                fetch('/api/scan/progress').then(r=>r.json()).then(data => {
                    if (data.total > 0) {
                        const pct = Math.round((data.current / data.total) * 100);
                        bar.style.width = pct + '%';
                        status.textContent = `${data.current}/${data.total} (${pct}%)`;
                        detail.textContent = data.current_file || '';
                    }
                    if (data.running) setTimeout(poll, 300);
                    else {
                        document.getElementById('scanModal').classList.remove('active');
                        if (data.complete) {
                            showToast(`扫描完成: 新增${data.added}, 更新${data.updated}, 跳过${data.skipped}`, 'success');
                            loadStats();
                            if (document.getElementById('searchInput').value) triggerSearch();
                        } else if (data.error) showToast('扫描出错: ' + data.error, 'error');
                    }
                });
            }
            poll();
        }

        function startDoiUpdate(updateAll) {
            closeScanOptions();
            fetch('/api/doi/update-all', {
                method: 'POST',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({update_all: updateAll})
            })
            .then(r=>r.json())
            .then(data => {
                if (data.success) { showToast('开始更新DOI...', 'info'); pollDoiProgress(); }
                else showToast(data.error || '无法启动', 'error');
            });
        }

        function checkDoiProgress() {
            fetch('/api/doi/progress').then(r=>r.json()).then(data => { if (data.running) pollDoiProgress(); });
        }

        function pollDoiProgress() {
            const bar = document.getElementById('doiProgressBar');
            const fill = document.getElementById('doiProgressFill');
            const text = document.getElementById('doiProgressText');
            bar.classList.add('active');
            document.body.classList.add('doi-updating');

            function poll() {
                fetch('/api/doi/progress').then(r=>r.json()).then(data => {
                    if (data.total > 0) {
                        const pct = Math.round((data.current / data.total) * 100);
                        fill.style.width = pct + '%';
                        text.textContent = `更新中 ${data.current}/${data.total} (${pct}%): ${data.current_paper_title||''}`;
                    }
                    document.querySelectorAll('.paper-card.updating').forEach(el=>el.classList.remove('updating'));
                    if (data.current_paper_id) {
                        const card = document.querySelector(`.paper-card[data-id="${data.current_paper_id}"]`);
                        if (card) card.classList.add('updating');
                    }
                    if (data.running) setTimeout(poll, 500);
                    else {
                        bar.classList.remove('active');
                        document.body.classList.remove('doi-updating');
                        document.querySelectorAll('.paper-card.updating').forEach(el=>el.classList.remove('updating'));
                        if (data.complete) {
                            showToast(`DOI更新完成: ${data.updated}成功, ${data.failed}失败`, 'success');
                            loadStats();
                            if (document.getElementById('searchInput').value) triggerSearch();
                        }
                    }
                });
            }
            poll();
        }

        function cancelDoiUpdate() {
            fetch('/api/doi/cancel', {method:'POST'}).then(r=>r.json()).then(d=>{if(d.success)showToast('正在取消...','info');});
        }

        function updateFloatingStats() {
            document.getElementById('floatingStatPapers').textContent = document.getElementById('statPapers').textContent;
            document.getElementById('floatingStatTags').textContent = document.getElementById('statTags').textContent;
        }

        const _origLoadStats = window.loadStats;
        if (_origLoadStats) { window.loadStats = async function() { await _origLoadStats(); updateFloatingStats(); }; }
    </script>
</body>
</html>
