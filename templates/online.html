<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Search - 在线文献检索</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        .embed-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            margin: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .embed-container iframe {
            flex: 1;
            border: none;
            width: 100%;
            min-height: calc(100vh - 150px);
        }
        .embed-header {
            padding: 0.75rem 1rem;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .embed-header h3 {
            margin: 0;
            font-family: var(--font-serif);
            font-size: 1rem;
        }
        .embed-header a {
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <div class="main-content">
            <!-- Header -->
            <header class="header">
                <div class="header-content">
                    <div class="logo">
                        <span class="logo-icon">🌐</span>
                        <div>
                            <div class="logo-text">Online Search</div>
                            <div class="logo-subtitle">在线文献检索</div>
                        </div>
                    </div>
                    <nav class="header-nav">
                        <a href="/" class="nav-link">本地文献</a>
                        <a href="/online" class="nav-link active">在线搜索</a>
                    </nav>
                </div>
            </header>

            <!-- Econ Paper Search Embed -->
            <div class="embed-container">
                <div class="embed-header">
                    <h3>📚 Econ Paper Search - 经济学论文检索</h3>
                    <a href="https://econ-paper-search.streamlit.app/" target="_blank" rel="noopener">
                        🔗 在新窗口打开
                    </a>
                </div>
                <iframe
                    src="https://econ-paper-search.streamlit.app/?embedded=true"
                    title="Econ Paper Search"
                    allow="clipboard-write">
                </iframe>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Toast utility (for any future notifications)
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
